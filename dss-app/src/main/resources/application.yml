# 公共配置。数据库和中间件都不在本机，地址和口令全部来自环境变量，清单见 docs/中间件配置.md 第 2 节。
# 没有默认值的变量是必填的：没设置时应用启动会直接失败（故意的，宁可起不来也不连错地址）。
spring:
  application:
    name: dss
  profiles:
    active: ${DSS_PROFILE:dev}
  jackson:
    # LocalDateTime 的格式由 JacksonConfig 统一为 yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      # 框架层上限；单张图片的业务上限是 dss.file.max-size
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    mongodb:
      # 必填。MongoDB 必须是副本集（事务要用），见 docs/中间件配置.md 4.1
      uri: ${DSS_MONGO_URI}
      # 索引只由 docs/中间件配置.md 4.7 的建结构脚本创建
      auto-index-creation: false
    redis:
      host: ${DSS_REDIS_HOST}
      port: ${DSS_REDIS_PORT:6379}
      password: ${DSS_REDIS_PASSWORD:}
      # 项目不用 Redis 仓库，关掉可以避免启动时的无关日志
      repositories:
        enabled: false
  rabbitmq:
    host: ${DSS_RABBIT_HOST}
    port: ${DSS_RABBIT_PORT:5672}
    virtual-host: ${DSS_RABBIT_VHOST:/dss}
    username: ${DSS_RABBIT_USERNAME}
    password: ${DSS_RABBIT_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        # 重试用完后不重新入队，进死信队列
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  elasticsearch:
    uris: ${DSS_ES_URIS}
    # ES 开了安全认证时才需要
    username: ${DSS_ES_USERNAME:}
    password: ${DSS_ES_PASSWORD:}

server:
  port: ${DSS_SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: ${DSS_SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${DSS_SWAGGER_ENABLED:true}
    path: /swagger-ui.html

dss:
  internal:
    # 内部接口口令；为空时内部接口一律拒绝
    key: ${DSS_INTERNAL_KEY:}
  auth:
    token-ttl: ${DSS_AUTH_TOKEN_TTL:P7D}
  file:
    # 为空时返回以 / 开头的站点相对地址，由 Nginx 反代到 FastDFS
    base-url: ${DSS_FILE_BASE_URL:}
    max-size: ${DSS_FILE_MAX_SIZE:5MB}
    allowed-types: ${DSS_FILE_ALLOWED_TYPES:image/jpeg,image/png,image/webp}
    fastdfs:
      tracker-servers: ${DSS_FDFS_TRACKER_SERVERS:}
      connect-timeout: ${DSS_FDFS_CONNECT_TIMEOUT:PT5S}
      network-timeout: ${DSS_FDFS_NETWORK_TIMEOUT:PT30S}
  order:
    # 同时决定延迟队列 order.timeout.delay 的 TTL；改了要先删掉旧队列
    pay-timeout-minutes: ${DSS_ORDER_PAY_TIMEOUT_MINUTES:15}
  job:
    # 骨架期关闭，否则桩方法会定时报错
    enabled: ${DSS_JOB_ENABLED:false}
    timeout-fallback-interval: ${DSS_JOB_TIMEOUT_FALLBACK_INTERVAL:PT5M}
    voucher-expire-interval: ${DSS_JOB_VOUCHER_EXPIRE_INTERVAL:PT10M}

logging:
  level:
    root: info
