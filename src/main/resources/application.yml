# 公共配置。数据库和中间件都不在本机，地址、账号和密钥全部来自环境变量，清单见 docs/中间件配置.md 第 2 节。
# 没有默认值的变量是必填的：没设置时应用启动会直接失败（故意的，宁可起不来也不连错地址）。
spring:
  application:
    name: dss
  # 本地开发：启动时把工作目录下的 .env 当作 properties 读进来（模块工作目录就是 tikcookie-api，.env 已在 .gitignore 里）。
  # optional: 文件不存在时静默跳过；操作系统环境变量优先级高于配置文件，所以服务器/CI 用真实环境变量注入时不受影响。
  config:
    import: optional:file:./.env[.properties]
  profiles:
    active: ${DSS_PROFILE:dev}
  jackson:
    # LocalDateTime 的格式由 JacksonConfig 统一为 yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      # 框架层上限；单张图片的业务上限是 dss.file.max-size
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 表结构由仓库根目录的 dss-init.sql 创建（管理账号执行），应用账号只需要 dss 库的增删改查权限
    url: jdbc:mysql://${DSS_MYSQL_HOST}:${DSS_MYSQL_PORT:3306}/${DSS_MYSQL_DATABASE:dss}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai
    username: ${DSS_MYSQL_USERNAME}
    password: ${DSS_MYSQL_PASSWORD}
  data:
    redis:
      host: ${DSS_REDIS_HOST}
      port: ${DSS_REDIS_PORT:6379}
      password: ${DSS_REDIS_PASSWORD}
      # 项目不用 Redis 仓库，关掉可以避免启动时的无关日志
      repositories:
        enabled: false
  rabbitmq:
    host: ${DSS_RABBIT_HOST}
    port: ${DSS_RABBIT_PORT:5672}
    virtual-host: ${DSS_RABBIT_VHOST:/dss}
    username: ${DSS_RABBIT_USERNAME}
    password: ${DSS_RABBIT_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        # 重试用完后不重新入队；死信绑定由使用 MQ 的业务队列定义，搜索不声明队列
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  elasticsearch:
    uris: ${DSS_ES_URIS}
    # ES 开了安全认证时才需要
    username: ${DSS_ES_USERNAME:}
    password: ${DSS_ES_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

server:
  port: ${DSS_SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: ${DSS_SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${DSS_SWAGGER_ENABLED:true}
    path: /swagger-ui.html

dss:
  internal:
    # 内部接口口令；为空时内部接口一律拒绝
    key: ${DSS_INTERNAL_KEY:}
  auth:
    token-ttl: ${DSS_AUTH_TOKEN_TTL:P7D}
  file:
    # 图片读取前缀（末尾不带 /）；返回的 url = base-url + "/" + fileId。
    # Bucket 已开公共读：填 OSS 公共域名（或自己的 CNAME 域名，如 https://<bucket>.oss-<region>.aliyuncs.com），
    # 游客和登录用户都能用 <img src> 直连看图；留空则按下面的 oss.endpoint + bucket 自动推导同一个域名。
    # 也可以填后端代理读图接口（本地 http://127.0.0.1:8080/api/v1/images、服务器 https://<演示域名>/api/v1/images），
    # 图片改走后端转发，适合 Bucket 再次收紧为私有读的情况。
    base-url: ${DSS_FILE_BASE_URL:}
    max-size: ${DSS_FILE_MAX_SIZE:5MB}
    allowed-types: ${DSS_FILE_ALLOWED_TYPES:image/jpeg,image/png,image/webp}
    oss:
      endpoint: ${DSS_OSS_ENDPOINT}
      bucket: ${DSS_OSS_BUCKET}
      region: ${DSS_OSS_REGION}
      # 按凭据方式填写；实际值只放在受控的环境文件里，不进仓库
      access-key-id: ${DSS_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${DSS_OSS_ACCESS_KEY_SECRET:}
  order:
    # 待支付超时：payDeadline = 下单时间 + 它
    pay-timeout-minutes: ${DSS_ORDER_PAY_TIMEOUT_MINUTES:15}
  job:
    # 订单定时任务；实现完再打开，否则桩方法每分钟报错。单实例执行，不加锁
    enabled: ${DSS_JOB_ENABLED:false}
    order-timeout-interval: ${DSS_JOB_ORDER_TIMEOUT_INTERVAL:PT1M}
    voucher-expire-interval: ${DSS_JOB_VOUCHER_EXPIRE_INTERVAL:PT1M}
  search:
    # Logstash 唯一写入方：必须保持 false。误设 true 时明确启动失败，不执行删索引。
    rebuild-on-startup: ${DSS_SEARCH_REBUILD_ON_STARTUP:false}
  demo:
    # 启动时自动灌抢购演示数据（只在库内还没有演示数据时播种一次，不覆盖已有数据）；默认关，生产不要开
    seed-enabled: ${DSS_DEMO_SEED_ENABLED:false}

logging:
  level:
    root: info
