# Install in the host Nginx http{} include directory; remove conflicting default_server.
# Host JAR must bind 127.0.0.1:8080. No TLS here: trusted-network demo only.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/tikcookie-web/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Regex deliberately precedes the generic API proxy (do not add ^~ to /api/).
    location ~* ^/(?:api/)?(?:(?:v[0-9]+/)?internal|swagger-ui(?:\.html)?|swagger-resources|(?:v[0-9]+/)?api-docs)(?:/|$) {
        return 404;
    }
    location ~ /\. {
        return 404;
    }

    location = /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Key "";
    }
    location /api/ {
        # No trailing slash: /api/v1/... must reach Spring with its /api prefix.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Key "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # OSS image URLs come from the API. Never inject OSS credentials into Nginx/dist/URLs.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
