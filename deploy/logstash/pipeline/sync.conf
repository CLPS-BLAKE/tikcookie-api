      path => "/usr/share/logstash/data/quarantine/invalid.jsonl"
      codec => json_lines
    }
  } else {
    elasticsearch {
      hosts => ["http://es:9200"]
      user => "elastic"
      password => "${DSS_ES_PASSWORD}"
      index => "%{[@metadata][target_index]}"
